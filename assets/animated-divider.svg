<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-labelledby="title">
  <title id="title">Animated lavender and rose profile divider</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B7EDB" stop-opacity="0" />
      <stop offset="0.25" stop-color="#9B7EDB" />
      <stop offset="0.5" stop-color="#E6A6C7" />
      <stop offset="0.75" stop-color="#9B7EDB" />
      <stop offset="1" stop-color="#9B7EDB" stop-opacity="0" />
      <animate attributeName="x1" values="0;1;0" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="1;0;1" dur="5s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <path d="M20 14 H1180" fill="none" stroke="url(#line)" stroke-width="2" filter="url(#glow)" />
  <circle cx="600" cy="14" r="4" fill="#E6A6C7">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.65;1;0.65" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="14" r="9" fill="none" stroke="#C9A7F7" stroke-opacity="0.65">
    <animate attributeName="r" values="5;12;5" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" repeatCount="indefinite" />
  </circle>
</svg>
